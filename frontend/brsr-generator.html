<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BRSR Auto-Report Generator - Sparc Energy</title>
  <meta name="description" content="Generate an indicative BRSR Principle 6 narrative draft from company sustainability inputs." />
  <link rel="stylesheet" href="css/styles.css?v=4" />
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo"><div class="logo-icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div><div class="logo-text">Sparc Energy</div><div class="logo-sub">CARBON INTELLIGENCE</div></div></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Overview</a>
      <a href="scope-calculator.html" class="nav-link">Scope Calculator</a>
      <a href="brsr-generator.html" class="nav-link active">BRSR Generator</a>
      <a href="consultation.html" class="nav-link">Consultation</a>
    </div>
  </nav>

  <main class="container section">
    <h1 class="section-title">BRSR Auto-Report Generator</h1>
    <p class="section-sub">Create a structured draft for BRSR Principle 6 (Environment). You can later connect this to Claude API.</p>

    <section class="card">
      <div class="grid-3">
        <div class="form-group"><label class="form-label" for="companyName">Company Name</label><input id="companyName" class="form-input" title="Company Name" /></div>
        <div class="form-group"><label class="form-label" for="cin">CIN</label><input id="cin" class="form-input" title="CIN" /></div>
        <div class="form-group"><label class="form-label" for="fy">Financial Year</label><input id="fy" class="form-input" placeholder="e.g. 2025-26" title="Financial Year" /></div>
      </div>
      <div class="grid-3 mt-16">
        <div class="form-group"><label class="form-label" for="s1">Scope 1 (tCO2e)</label><input id="s1" type="number" class="form-input" min="0" title="Scope 1 emissions" /></div>
        <div class="form-group"><label class="form-label" for="s2">Scope 2 (tCO2e)</label><input id="s2" type="number" class="form-input" min="0" title="Scope 2 emissions" /></div>
        <div class="form-group"><label class="form-label" for="s3">Scope 3 (tCO2e)</label><input id="s3" type="number" class="form-input" min="0" title="Scope 3 emissions" /></div>
      </div>
      <div class="grid-3 mt-16">
        <div class="form-group"><label class="form-label" for="renewable">Renewable Energy (%)</label><input id="renewable" type="number" class="form-input" min="0" max="100" title="Renewable energy percentage" /></div>
        <div class="form-group"><label class="form-label" for="water">Water Consumption (kL/year)</label><input id="water" type="number" class="form-input" min="0" title="Water consumption in kilo-litres per year" /></div>
        <div class="form-group"><label class="form-label" for="waste">Waste Generated (tons/year)</label><input id="waste" type="number" class="form-input" min="0" title="Waste generated in tons per year" /></div>
      </div>
      <button class="btn btn-primary mt-20" onclick="generateDraft()">Generate My BRSR Draft</button>
    </section>

    <section class="card mt-20" id="draftSection" style="display:none;">
      <h2 class="card-title">Generated Draft (Principle 6)</h2>
      <div id="draftHtml" class="text-sm text-muted mt-16" style="line-height:1.7;"></div>
      <div class="mt-20" style="display:flex; gap:10px; flex-wrap:wrap;">
        <button class="btn btn-secondary" onclick="downloadDraft()">Download as HTML</button>
        <a href="consultation.html" class="btn btn-primary">Book Review Call</a>
      </div>
    </section>
  </main>

  <script>
    function n(id) { return Number(document.getElementById(id).value || "0"); }
    function v(id) { return document.getElementById(id).value || "-"; }

    function generateDraft() {
      const company = v("companyName");
      const cin = v("cin");
      const fy = v("fy");
      const s1 = n("s1");
      const s2 = n("s2");
      const s3 = n("s3");
      const total = s1 + s2 + s3;
      const renewable = n("renewable");
      const water = n("water");
      const waste = n("waste");

      const html = `
        <p><strong>Company:</strong> ${company} | <strong>CIN:</strong> ${cin} | <strong>FY:</strong> ${fy}</p>
        <h3>P6-Q1 to P6-Q3: GHG Emissions</h3>
        <p>For FY ${fy}, total emissions were <strong>${total.toFixed(2)} tCO2e</strong>, comprising Scope 1: ${s1.toFixed(2)}, Scope 2: ${s2.toFixed(2)}, and Scope 3: ${s3.toFixed(2)} tCO2e.</p>
        <h3>P6-Q4: Energy Management</h3>
        <p>The organization reports renewable energy share at <strong>${renewable.toFixed(1)}%</strong>. Ongoing efforts include energy efficiency and procurement of cleaner energy sources.</p>
        <h3>P6-Q5 to P6-Q7: Water and Waste</h3>
        <p>Annual water consumption is reported at <strong>${water.toFixed(2)} kL</strong>. Total waste generated is <strong>${waste.toFixed(2)} tons</strong>, with management practices aligned to regulatory norms.</p>
        <h3>P6-Q8 to P6-Q9: Offsets and Environmental Governance</h3>
        <p>The company is evaluating verified carbon credits to address residual emissions and strengthen long-term environmental performance reporting.</p>
        <p><em>Note: This is an indicative draft. Validate with audited data before filing.</em></p>
      `;

      document.getElementById("draftHtml").innerHTML = html;
      document.getElementById("draftSection").style.display = "block";
    }

    function downloadDraft() {
      const content = document.getElementById("draftHtml").innerHTML;
      const blob = new Blob([`<html><body>${content}</body></html>`], { type: "text/html" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "brsr-draft.html";
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
