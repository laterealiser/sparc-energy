<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Free Consultation - Sparc Energy</title>
  <meta name="description" content="Book a free carbon credit consultation with Sparc Energy." />
  <link rel="stylesheet" href="css/styles.css?v=4" />
</head>
<body>
  <div class="vid-bg-wrap">
    <iframe title="Consultation Background" src="https://www.youtube.com/embed/WeDvNscRRPE?autoplay=1&mute=1&loop=1&playlist=WeDvNscRRPE&controls=0&showinfo=0&rel=0&modestbranding=1&playsinline=1" frameborder="0" allow="autoplay; encrypted-media" allowfullscreen></iframe>
  </div>
  <div class="page-bg-overlay"></div>

  <nav class="navbar">
    <a href="index.html" class="nav-logo"><div class="logo-icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div><div class="logo-text">Sparc Energy</div><div class="logo-sub">CARBON INTELLIGENCE</div></div></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Overview</a>
      <a href="marketplace.html" class="nav-link">Projects</a>
      <a href="consultation.html" class="nav-link active">Consultation</a>
      <a href="estimator.html" class="nav-link">Estimator</a>
    </div>
  </nav>

  <main class="container section">
    <div class="grid-2">
      <section class="card card-glow">
        <h1 class="section-title" style="font-size:42px; margin-bottom:10px;">Book a Free Consultation</h1>
        <p class="section-sub">Tell us about your organization and offset goals. We will contact you within 24 hours.</p>
        <form id="consultationForm" action="https://formspree.io/f/your-form-id" method="POST">
          <div class="grid-2">
            <div class="form-group"><label class="form-label" for="c-first-name">First Name</label><input id="c-first-name" class="form-input" name="first_name" required title="First Name" /></div>
            <div class="form-group"><label class="form-label" for="c-last-name">Last Name</label><input id="c-last-name" class="form-input" name="last_name" required title="Last Name" /></div>
          </div>
          <div class="form-group mt-16"><label class="form-label" for="c-email">Work Email</label><input id="c-email" class="form-input" type="email" name="email" required title="Work Email" /></div>
          <div class="form-group mt-16"><label class="form-label" for="c-company">Company Name</label><input id="c-company" class="form-input" name="company_name" required title="Company Name" /></div>
          <div class="grid-2 mt-16">
            <div class="form-group">
              <label class="form-label" for="c-industry">Industry</label>
              <select id="c-industry" class="form-select" name="industry" required title="Industry">
                <option value="">Select Industry</option>
                <option>Manufacturing</option>
                <option>IT / Technology</option>
                <option>Energy / Utilities</option>
                <option>Retail / FMCG</option>
                <option>Financial Services</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label" for="c-emissions-range">Annual Emissions Range</label>
              <select id="c-emissions-range" class="form-select" name="emissions_range" required title="Annual Emissions Range">
                <option value="">Select Range</option>
                <option>&lt; 1,000 tCO2e</option>
                <option>1,000 - 10,000 tCO2e</option>
                <option>10,000 - 50,000 tCO2e</option>
                <option>&gt; 50,000 tCO2e</option>
              </select>
            </div>
          </div>
          <div class="form-group mt-16"><label class="form-label" for="c-message">Message</label><textarea id="c-message" class="form-input" rows="4" name="message" placeholder="Tell us your timeline and requirements" title="Message"></textarea></div>
          <button class="btn btn-primary mt-20" type="submit">Submit Request</button>
          <p id="submitMessage" class="text-sm mt-16 text-muted"></p>
        </form>
      </section>

      <section class="card">
        <h2 class="card-title" style="font-size:22px;">Schedule Directly</h2>
        <p class="text-muted text-sm mt-8">You can also pick a time slot directly using Calendly.</p>
        <div style="margin-top:16px; border:1px solid var(--glass-border); border-radius:12px; overflow:hidden;">
          <iframe src="https://calendly.com" title="Calendly booking" style="width:100%; height:620px; border:0;"></iframe>
        </div>
      </section>
    </div>
  </main>

  <script>
    document.getElementById("consultationForm").addEventListener("submit", function (event) {
      event.preventDefault();
      document.getElementById("submitMessage").textContent = "Thank you. We will contact you within 24 hours.";
      this.reset();
    });
  </script>
</body>
</html>
