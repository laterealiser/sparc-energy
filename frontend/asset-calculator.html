<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Asset Value Calculator - Sparc Energy</title>
  <link rel="stylesheet" href="css/styles.css?v=4" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo"><div class="logo-icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div><div class="logo-text">Sparc Energy</div><div class="logo-sub">CARBON INTELLIGENCE</div></div></a>
    <div class="nav-links">
      <a href="index.html" class="nav-link">Overview</a>
      <a href="estimator.html" class="nav-link">Estimator</a>
      <a href="asset-calculator.html" class="nav-link active">Asset Calculator</a>
      <a href="timeline.html" class="nav-link">Timeline</a>
    </div>
  </nav>

  <main class="container section">
    <h1 class="section-title">Asset Value Calculator</h1>
    <p class="section-sub">Estimate carbon credits and potential revenue from your land/project profile.</p>

    <section class="card">
      <div class="grid-3">
        <div class="form-group"><label class="form-label" for="landSize">Land Size (hectares)</label><input id="landSize" class="form-input" type="number" min="0.1" step="0.1" title="Land Size in hectares"></div>
        <div class="form-group">
          <label class="form-label" for="landType">Land Type</label>
          <select id="landType" class="form-select" title="Land Type">
            <option value="forest">Tropical Forest (Reforestation)</option>
            <option value="degraded">Degraded Land (Afforestation)</option>
            <option value="farmland">Farmland (Agroforestry)</option>
            <option value="mangrove">Mangrove Restoration</option>
            <option value="wetland">Wetland Conservation</option>
          </select>
        </div>
        <div class="form-group"><label class="form-label" for="projectType">Project Type</label><select id="projectType" class="form-select" title="Project Type"><option>Reforestation</option><option>Afforestation</option><option>Agroforestry</option><option>Solar</option><option>Biogas</option></select></div>
      </div>
      <button class="btn btn-primary mt-20" onclick="estimateAsset()">Estimate My Carbon Asset Value</button>
    </section>

    <section class="card mt-20" id="assetResults" style="display:none;">
      <div class="grid-3">
        <div><div class="stat-label">Credits / Year</div><div class="stat-value" id="creditsYear"></div></div>
        <div><div class="stat-label">Credits / 10 Years</div><div class="stat-value" id="creditsTen"></div></div>
        <div><div class="stat-label">Revenue Range (10 Years)</div><div class="stat-value" id="revenueRange"></div></div>
      </div>
      <p class="text-sm text-muted mt-16" id="assetSummary"></p>
      <canvas id="projectionChart" style="margin-top:16px; max-height:300px;"></canvas>
      <a href="consultation.html" class="btn btn-primary mt-20">Get a Free Project Assessment</a>
    </section>
  </main>

  <script>
    const sequestration = {
      forest: { min: 8, max: 20, priceMin: 670, priceMax: 1500, cert: "Verra VCS" },
      degraded: { min: 4, max: 10, priceMin: 670, priceMax: 1500, cert: "Verra VCS" },
      farmland: { min: 3, max: 7, priceMin: 1250, priceMax: 2500, cert: "Gold Standard" },
      mangrove: { min: 15, max: 35, priceMin: 1670, priceMax: 4200, cert: "Blue Carbon Methodology" },
      wetland: { min: 5, max: 15, priceMin: 1670, priceMax: 4200, cert: "Blue Carbon Methodology" }
    };
    let chart;

    function estimateAsset() {
      const size = Number(document.getElementById("landSize").value || "0");
      const type = document.getElementById("landType").value;
      if (!size || size <= 0) { alert("Enter land size in hectares."); return; }

      const s = sequestration[type];
      const creditsYearMin = size * s.min;
      const creditsYearMax = size * s.max;
      const creditsYearMid = Math.round((creditsYearMin + creditsYearMax) / 2);
      const creditsTen = creditsYearMid * 10;
      const revenueMin = creditsTen * s.priceMin;
      const revenueMax = creditsTen * s.priceMax;

      document.getElementById("creditsYear").textContent = `${Math.round(creditsYearMin)} - ${Math.round(creditsYearMax)} tCO2e`;
      document.getElementById("creditsTen").textContent = `${creditsTen.toLocaleString()} tCO2e`;
      document.getElementById("revenueRange").textContent = `₹${Math.round(revenueMin).toLocaleString("en-IN")} - ₹${Math.round(revenueMax).toLocaleString("en-IN")}`;
      document.getElementById("assetSummary").textContent = `Recommended certification: ${s.cert}. Estimates are indicative and subject to verification.`;
      document.getElementById("assetResults").style.display = "block";

      const labels = Array.from({ length: 10 }, (_, i) => `Year ${i + 1}`);
      const revenueSeries = labels.map((_, i) => Math.round((i + 1) * creditsYearMid * ((s.priceMin + s.priceMax) / 2)));
      if (chart) chart.destroy();
      chart = new Chart(document.getElementById("projectionChart"), {
        type: "line",
        data: { labels, datasets: [{ label: "Projected cumulative revenue (INR)", data: revenueSeries, borderColor: "#00f5b8", backgroundColor: "rgba(0,245,184,0.15)", tension: 0.3 }] },
        options: { responsive: true, plugins: { legend: { labels: { color: "#e6efe9" } } }, scales: { x: { ticks: { color: "#94a3b8" } }, y: { ticks: { color: "#94a3b8" } } } }
      });
    }
  </script>

  <a id="fab" class="fab-modern" href="auth.html">
    <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" />
    </svg>
    <span>Get Started</span>
  </a>

</body>
</html>
