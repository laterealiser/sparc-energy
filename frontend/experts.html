<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Find Carbon Market Experts — Sparc Energy</title>
  <meta name="description" content="Find verified carbon market experts for PDD writing, project validation, BRSR reporting, and carbon accounting."/>
  <link rel="canonical" href="https://sparcenergy.in/experts"/>
  <meta property="og:title" content="Find Carbon Market Experts — Sparc Energy"/>
  <meta property="og:type" content="website"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/luxury.css"/>
  <style>
    .experts-layout { display:grid; grid-template-columns:280px 1fr; gap:40px; align-items:start; }
    .experts-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(340px,1fr)); gap:24px; }
    .expert-card { background:var(--white); border:1px solid var(--border); border-radius:16px; padding:28px; position:relative; transition:all 0.25s var(--ease); }
    .expert-card:hover { box-shadow:var(--shadow-lg); transform:translateY(-2px); border-color:var(--border-2); }
    .verified-badge { position:absolute; top:16px; right:16px; background:#DCFCE7; color:#166534; padding:4px 10px; border-radius:20px; font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; }
    .expert-avatar { width:56px; height:56px; border-radius:50%; background:var(--forest); display:flex; align-items:center; justify-content:center; font-weight:700; font-size:18px; color:var(--sage); flex-shrink:0; }
    .expert-name { font-family:var(--f-serif); font-size:19px; font-weight:600; color:var(--forest); margin-bottom:3px; }
    .expert-type { font-size:13px; font-weight:600; color:var(--sage-mid); margin-bottom:8px; }
    .stars { color:#F59E0B; font-size:13px; }
    .detail-row { display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--border); font-size:13px; }
    .detail-row:last-child { border-bottom:none; }
    .cert-tag { display:inline-flex; padding:3px 9px; background:var(--sage-lt); color:var(--sage-mid); border-radius:20px; font-size:11px; font-weight:600; }
    .expert-bio { font-size:13.5px; color:var(--slate-2); line-height:1.6; margin:16px 0; }
    .expert-cta { width:100%; padding:11px; background:var(--forest); color:white; border:none; border-radius:8px; font-weight:600; font-size:14px; cursor:pointer; transition:all 0.2s; }
    .expert-cta:hover { background:var(--forest-2); }
    .search-input { width:100%; padding:11px 14px; border:1.5px solid var(--border); border-radius:8px; font-size:14px; font-family:var(--f-sans); outline:none; transition:border-color 0.2s; background:var(--white); }
    .search-input:focus { border-color:var(--sage); }
    .no-results { grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--slate-2); font-size:16px; }
    @media(max-width:900px){ .experts-layout{grid-template-columns:1fr;} .experts-grid{grid-template-columns:1fr;} }
  </style>
</head>
<body>

  <!-- ── PAGE HERO ── -->
  <section class="lux-page-hero">
    <div class="lux-page-hero-inner">
      <div class="lux-page-eyebrow">Expert Network</div>
      <h1 class="lux-page-h1">Find a Carbon Market <em>Expert</em></h1>
      <p class="lux-page-sub">Verified professionals for PDD writing, project validation, BRSR reporting and carbon accounting</p>
    </div>
  </section>

  <!-- ── EXPERTS ── -->
  <section class="lux-section">
    <div class="lux-container">
      <div class="experts-layout">

        <!-- Sidebar -->
        <div class="lux-filter-sidebar">
          <div class="lux-filter-title">Filter Experts</div>

          <div style="margin-bottom:20px;">
            <input type="text" id="expertSearch" class="search-input" placeholder="Search by name, skill..." oninput="applyFilters()"/>
          </div>

          <div class="lux-filter-group">
            <div class="lux-filter-group-title">Expert Type</div>
            <label class="lux-filter-check"><input type="checkbox" value="PDD Writer" onchange="applyFilters()"/><span>PDD Writer</span></label>
            <label class="lux-filter-check"><input type="checkbox" value="Project Validator" onchange="applyFilters()"/><span>Project Validator</span></label>
            <label class="lux-filter-check"><input type="checkbox" value="Third-Party Auditor" onchange="applyFilters()"/><span>Third-Party Auditor</span></label>
            <label class="lux-filter-check"><input type="checkbox" value="BRSR Consultant" onchange="applyFilters()"/><span>BRSR Consultant</span></label>
            <label class="lux-filter-check"><input type="checkbox" value="Carbon Accountant" onchange="applyFilters()"/><span>Carbon Accountant</span></label>
            <label class="lux-filter-check"><input type="checkbox" value="ESG Consultant" onchange="applyFilters()"/><span>ESG Consultant</span></label>
          </div>

          <div class="lux-filter-group">
            <div class="lux-filter-group-title">Certification</div>
            <label class="lux-filter-check"><input type="checkbox" value="Verra VCS" onchange="applyFilters()"/><span>Verra VCS</span></label>
            <label class="lux-filter-check"><input type="checkbox" value="Gold Standard" onchange="applyFilters()"/><span>Gold Standard</span></label>
            <label class="lux-filter-check"><input type="checkbox" value="ISO14064" onchange="applyFilters()"/><span>ISO 14064</span></label>
            <label class="lux-filter-check"><input type="checkbox" value="BRSR Specialist" onchange="applyFilters()"/><span>BRSR Specialist</span></label>
          </div>

          <div class="lux-filter-group">
            <div class="lux-filter-group-title">Verified Only</div>
            <label class="lux-filter-check"><input type="checkbox" id="verifiedOnly" onchange="applyFilters()"/><span><strong>Sparc Verified</strong></span></label>
          </div>

          <button onclick="clearFilters()" style="width:100%;padding:10px;border:1.5px solid var(--border-2);border-radius:8px;font-size:14px;font-weight:500;color:var(--slate);cursor:pointer;background:none;transition:all 0.2s;" onmouseover="this.style.background='var(--ivory-2)'" onmouseout="this.style.background='none'">Clear Filters</button>

          <div style="margin-top:24px;padding:20px;background:var(--sage-lt);border-radius:12px;text-align:center;">
            <div style="font-size:13px;font-weight:600;color:var(--forest);margin-bottom:8px;">Are you an expert?</div>
            <a href="experts/register.html" style="display:inline-block;padding:9px 18px;background:var(--forest);color:white;border-radius:8px;font-size:13px;font-weight:600;">Join Our Network</a>
          </div>
        </div>

        <!-- Grid -->
        <div>
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;">
            <p style="font-size:14px;color:var(--slate-2);">Showing <strong id="expertCount" style="color:var(--forest);">8</strong> experts</p>
          </div>
          <div class="experts-grid" id="expertsGrid"></div>
        </div>
      </div>
    </div>
  </section>

  <script src="js/lux-nav.js"></script>
  <script>
    renderNav('Experts');
    renderFooter();

    const experts = [
      { id:1, name:"Priya Sharma", type:"PDD Writer", location:"Maharashtra", experience:"8 years", projects:24, certifications:["Verra VCS","Gold Standard"], rate:"₹2–10L", verified:true, rating:4.8, reviews:12, bio:"Experienced PDD writer specializing in reforestation and renewable energy projects across India.", initials:"PS" },
      { id:2, name:"Rajesh Kumar", type:"Project Validator", location:"Delhi", experience:"12 years", projects:41, certifications:["Verra VCS","CDM","ISO14064"], rate:"₹10L+", verified:true, rating:4.9, reviews:18, bio:"Senior project validator with extensive experience in large-scale renewable energy and AFOLU projects.", initials:"RK" },
      { id:3, name:"Ananya Rao", type:"BRSR Consultant", location:"Karnataka", experience:"5 years", projects:18, certifications:["BRSR Specialist","GHG Protocol"], rate:"₹50K–2L", verified:true, rating:4.7, reviews:9, bio:"BRSR specialist helping companies navigate ESG reporting requirements and sustainability disclosures.", initials:"AR" },
      { id:4, name:"Mohammed Faiz", type:"Carbon Accountant", location:"Gujarat", experience:"7 years", projects:31, certifications:["ISO14064","GHG Protocol"], rate:"₹2–10L", verified:false, rating:4.6, reviews:15, bio:"Carbon accounting expert with focus on manufacturing and industrial emissions measurement.", initials:"MF" },
      { id:5, name:"Sunita Patel", type:"ESG Consultant", location:"Tamil Nadu", experience:"6 years", projects:22, certifications:["GRI","TCFD","BRSR Specialist"], rate:"₹50K–2L", verified:true, rating:4.8, reviews:11, bio:"ESG consultant specializing in sustainability strategy and climate risk assessment.", initials:"SP" },
      { id:6, name:"Vikram Singh", type:"Third-Party Auditor", location:"Delhi", experience:"10 years", projects:15, certifications:["ISO14064"], rate:"₹2–10L", verified:false, rating:4.5, reviews:8, bio:"Legal expert specializing in India CCTS regulations and carbon market compliance.", initials:"VS" },
      { id:7, name:"Deepa Menon", type:"Project Validator", location:"Kerala", experience:"9 years", projects:28, certifications:["Gold Standard","Verra VCS"], rate:"₹10L+", verified:true, rating:4.9, reviews:14, bio:"Gold Standard auditor with expertise in community-based carbon projects and co-benefits assessment.", initials:"DM" },
      { id:8, name:"Arjun Nair", type:"PDD Writer", location:"Telangana", experience:"4 years", projects:11, certifications:["Verra VCS"], rate:"₹50K–2L", verified:false, rating:4.4, reviews:6, bio:"Emerging PDD writer focusing on technology-based emission reduction projects.", initials:"AN" }
    ];

    let filtered = [...experts];

    function renderExperts() {
      const grid = document.getElementById('expertsGrid');
      document.getElementById('expertCount').textContent = filtered.length;
      if (!filtered.length) { grid.innerHTML = '<div class="no-results">No experts match your criteria.</div>'; return; }
      grid.innerHTML = filtered.map(e => `
        <div class="expert-card">
          ${e.verified ? '<div class="verified-badge">✓ Sparc Verified</div>' : ''}
          <div style="display:flex;gap:14px;align-items:flex-start;margin-bottom:20px;">
            <div class="expert-avatar">${e.initials}</div>
            <div>
              <div class="expert-name">${e.name}</div>
              <div class="expert-type">${e.type}</div>
              <div style="display:flex;align-items:center;gap:6px;">
                <span class="stars">${'★'.repeat(Math.floor(e.rating))}${'☆'.repeat(5-Math.floor(e.rating))}</span>
                <span style="font-size:12px;color:var(--slate-3);">${e.rating} (${e.reviews} reviews)</span>
              </div>
            </div>
          </div>
          <div style="margin-bottom:16px;">
            <div class="detail-row"><span style="color:var(--slate-2);">Location</span><span style="font-weight:500;color:var(--forest);">${e.location}</span></div>
            <div class="detail-row"><span style="color:var(--slate-2);">Experience</span><span style="font-weight:500;color:var(--forest);">${e.experience}</span></div>
            <div class="detail-row"><span style="color:var(--slate-2);">Projects</span><span style="font-weight:500;color:var(--forest);">${e.projects} completed</span></div>
            <div class="detail-row"><span style="color:var(--slate-2);">Rate</span><span style="font-weight:500;color:var(--forest);">${e.rate} / project</span></div>
          </div>
          <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;">
            ${e.certifications.slice(0,3).map(c=>`<span class="cert-tag">${c}</span>`).join('')}
          </div>
          <p class="expert-bio">${e.bio}</p>
          <button class="expert-cta" onclick="contactExpert('${e.name}')">Contact Expert</button>
        </div>`).join('');
    }

    function applyFilters() {
      const checks = [...document.querySelectorAll('input[type=checkbox]:not(#verifiedOnly)')].filter(c=>c.checked).map(c=>c.value);
      const verifiedOnly = document.getElementById('verifiedOnly').checked;
      const q = document.getElementById('expertSearch').value.toLowerCase();
      filtered = experts.filter(e => {
        const matchQ = !q || e.name.toLowerCase().includes(q) || e.bio.toLowerCase().includes(q) || e.certifications.some(c=>c.toLowerCase().includes(q));
        const matchF = !checks.length || checks.includes(e.type) || e.certifications.some(c=>checks.includes(c));
        const matchV = !verifiedOnly || e.verified;
        return matchQ && matchF && matchV;
      });
      renderExperts();
    }

    function clearFilters() {
      document.querySelectorAll('input[type=checkbox]').forEach(c=>c.checked=false);
      document.getElementById('expertSearch').value='';
      filtered=[...experts];
      renderExperts();
    }

    function contactExpert(name) {
      window.location.href = `auth.html?redirect=experts.html&expert=${encodeURIComponent(name)}`;
    }

    document.addEventListener('DOMContentLoaded', renderExperts);
  </script>
</body>
</html>
