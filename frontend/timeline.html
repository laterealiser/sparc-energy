<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carbon Project Timeline Estimator - Sparc Energy</title>
  <link rel="stylesheet" href="css/styles.css?v=4" />
  <style>
    .timeline-row { display:grid; grid-template-columns: 2fr 1fr; gap:12px; margin-top:12px; }
    .timeline-track { height:10px; border-radius:999px; background:rgba(255,255,255,.08); overflow:hidden; }
    .timeline-fill { height:100%; background:linear-gradient(90deg, #00f5b8, #3d8bff); }
    @media (max-width: 700px) { .timeline-row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <nav class="navbar">
    <a href="index.html" class="nav-logo"><div class="logo-icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div><div class="logo-text">Sparc Energy</div><div class="logo-sub">CARBON INTELLIGENCE</div></div></a>
    <div class="nav-links"><a href="index.html" class="nav-link">Overview</a><a href="timeline.html" class="nav-link active">Timeline</a><a href="consultation.html" class="nav-link">Consultation</a></div>
  </nav>
  <main class="container section">
    <h1 class="section-title">Timeline Estimator</h1>
    <p class="section-sub">Estimate how long it takes to receive first credit issuance.</p>
    <section class="card">
      <div class="grid-3">
        <div class="form-group"><label class="form-label" for="projectType">Project Type</label><select id="projectType" class="form-select" title="Project Type"><option>Reforestation</option><option>Solar</option><option>Biogas</option><option>Cookstoves</option><option>Methane</option></select></div>
        <div class="form-group"><label class="form-label" for="standard">Certification Standard</label><select id="standard" class="form-select" title="Certification Standard"><option value="verra">Verra VCS</option><option value="gold">Gold Standard</option><option value="cdm">CDM</option></select></div>
        <div class="form-group"><label class="form-label" for="pdd">PDD Status</label><select id="pdd" class="form-select" title="PDD Status"><option value="yes">PDD ready</option><option value="progress">In progress</option><option value="no">No</option></select></div>
      </div>
      <button class="btn btn-primary mt-20" onclick="estimateTimeline()">Estimate Timeline</button>
    </section>

    <section class="card mt-20" id="timelineResult" style="display:none;">
      <h2 class="card-title">Estimated Milestones</h2>
      <p class="text-sm text-muted mt-8" id="summary"></p>
      <div id="rows"></div>
      <a href="consultation.html" class="btn btn-secondary mt-20">Connect with a PDD Writer</a>
    </section>
  </main>
  <script>
    const standards = {
      verra: [3, 4, 1.5, 14, 19],
      gold: [3, 6, 2, 13, 16],
      cdm: [4.5, 9, 3, 21, 30]
    };
    const labels = ["PDD", "Validation", "Registry Submission", "First Verification", "First Credit Issuance"];

    function estimateTimeline() {
      const standard = document.getElementById("standard").value;
      const pdd = document.getElementById("pdd").value;
      const values = [...standards[standard]];
      if (pdd === "no") values[0] += 2;
      if (pdd === "progress") values[0] += 1;
      const total = values[4];
      document.getElementById("summary").textContent = `Your first credits in approximately ${Math.round(total - 2)} to ${Math.round(total + 2)} months.`;
      const max = Math.max(...values);
      document.getElementById("rows").innerHTML = labels.map((label, idx) => `
        <div class="timeline-row">
          <div>
            <div class="text-sm" style="font-weight:600;">${label}</div>
            <div class="timeline-track"><div class="timeline-fill" style="width:${Math.round((values[idx]/max)*100)}%"></div></div>
          </div>
          <div class="text-sm text-muted">${values[idx]} months</div>
        </div>
      `).join("");
      document.getElementById("timelineResult").style.display = "block";
    }
  </script>
</body>
</html>
