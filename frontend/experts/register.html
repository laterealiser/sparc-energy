<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Expert Registration - Sparc Energy</title>
  <link rel="stylesheet" href="../css/styles.css?v=4" />
</head>
<body>
  <nav class="navbar">
    <a href="../index.html" class="nav-logo"><div class="logo-icon"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" viewBox="0 0 24 24"><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg></div><div><div class="logo-text">Sparc Energy</div><div class="logo-sub">CARBON INTELLIGENCE</div></div></a>
    <div class="nav-links"><a href="../experts.html" class="nav-link">Experts</a><a href="register.html" class="nav-link active">Register</a></div>
  </nav>

  <main class="container section">
    <h1 class="section-title">Expert Registration</h1>
    <p class="section-sub">Apply to join the Sparc Expert Marketplace. Profiles are manually reviewed in 3-5 business days.</p>
    <section class="card">
      <form id="registerForm">
        <div class="grid-2">
          <div class="form-group"><label class="form-label" for="name">Full Name</label><input id="name" class="form-input" required title="Full Name" /></div>
          <div class="form-group"><label class="form-label" for="email">Email</label><input id="email" type="email" class="form-input" required title="Email" /></div>
        </div>
        <div class="grid-2 mt-16">
          <div class="form-group"><label class="form-label" for="expertType">Expert Type</label><select id="expertType" class="form-select" title="Expert Type"><option>PDD Writer</option><option>VVB / DOE</option><option>Carbon Consultant</option><option>GIS Expert</option><option>BRSR Writer</option></select></div>
          <div class="form-group"><label class="form-label" for="experience">Years of Experience</label><input id="experience" type="number" min="0" class="form-input" title="Years of Experience" /></div>
        </div>
        <div class="form-group mt-16"><label class="form-label" for="portfolio">Portfolio Links</label><textarea id="portfolio" class="form-input" rows="4" title="Portfolio Links"></textarea></div>
        <div class="grid-2 mt-16">
          <div class="form-group"><label class="form-label" for="certUpload">Certification Documents</label><input id="certUpload" type="file" class="form-input" title="Certification Documents" /></div>
          <div class="form-group"><label class="form-label" for="idUpload">ID Proof</label><input id="idUpload" type="file" class="form-input" title="ID Proof" /></div>
        </div>
        <button class="btn btn-primary mt-20" type="submit">Submit for Review</button>
        <p id="msg" class="text-sm text-muted mt-16"></p>
      </form>
    </section>
  </main>
  <script>
    document.getElementById("registerForm").addEventListener("submit", function (e) {
      e.preventDefault();
      document.getElementById("msg").textContent = "Application submitted. Our team will review and contact you.";
      this.reset();
    });
  </script>
</body>
</html>
